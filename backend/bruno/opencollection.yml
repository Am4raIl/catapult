opencollection: 1.0.0

info:
  name: testes
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  scripts:
    - type: before-request
      code: |-
        req.setHeader('Accept', 'application/json');
        bru.setVar('base_url', bru.getEnvVar('base_url') || 'http://localhost:8080/api');
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
