# Conexão com o banco de dados
spring.datasource.url=jdbc:mysql://localhost:3306/project
spring.datasource.username=root
spring.datasource.password=1234

# Hibernate apenas VALIDA se as entidades batem com as tabelas
# criadas pelo Flyway - ele não cria nem altera nada sozinho
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# O INFORMATION_SCHEMA.KEYWORDS do MariaDB não possui a coluna RESERVED, o que faz
# getSQLKeywords() do Connector/J falhar na detecção automática de dialeto no boot.
# Informamos o dialeto explicitamente e desativamos a leitura de metadados JDBC no boot.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# Flyway: pasta onde ficam as migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.flyway.out-of-order=true

# Credencial inicial de desenvolvimento. Altere o valor e reinicie a aplicação;
# o DataSeeder gera o hash BCrypt e atualiza esse usuário automaticamente.
app.default-admin.username=admin
app.default-admin.password=admin
